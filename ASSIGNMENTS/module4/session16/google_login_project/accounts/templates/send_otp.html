<!DOCTYPE html>
<html>
<head>
    <title>Send OTP</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .card {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #777;
        }

        label {
            display: block;
            margin-top: 25px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d9;
        }

        .success {
            margin-top: 20px;
            padding: 12px;
            background: #dcfce7;
            color: #166534;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>📱 Send OTP</h1>

    <p>Enter your mobile number to receive a 6-digit OTP.</p>

    {% if messages %}
        {% for message in messages %}
            <div class="success">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>Mobile Number</label>

        <input
            type="text"
            name="phone_number"
            placeholder="+919876543210"
            required
        >

        <button type="submit">
            Send OTP
        </button>

    </form>
<a href="{% url 'verify_otp' %}">
    Verify OTP
</a>
</div>

</body>
</html>
