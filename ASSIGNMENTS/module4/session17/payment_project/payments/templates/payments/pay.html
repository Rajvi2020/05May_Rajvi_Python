```html
<!DOCTYPE html>
<html>
<head>
    <title>IPL Ticket Payment</title>
</head>
<body>

    <h1>IPL Match Ticket</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Name:</label>
        <input type="text" name="name" required>

        <br><br>

        <label>Email:</label>
        <input type="email" name="email" required>

        <br><br>

        <label>Amount:</label>
        <input type="number" name="amount" min="1" required>

        <br><br>

        <button type="submit">Pay Now</button>
    </form>

</body>
</html>
```
