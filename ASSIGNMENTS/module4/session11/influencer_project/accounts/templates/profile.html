{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
</head>
<body>

    <h1>My Profile</h1>

    <h2>{{ profile.display_name }}</h2>

    <p>{{ profile.bio }}</p>

    {% if profile.profile_pic %}
        <img src="{{ profile.profile_pic.url }}"
             alt="Profile Picture"
             width="200"
             height="200">
    {% else %}
        <img src="/static/images/default.png"
             alt="Default Profile Picture"
             width="200"
             height="200">
    {% endif %}

    <br><br>

    <a href="{% url 'edit_profile' %}">
        Edit Profile
    </a>

</body>
</html>
