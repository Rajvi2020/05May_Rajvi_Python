<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant Location</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .location-info {
            margin-bottom: 20px;
        }

        .error {
            color: red;
            margin-bottom: 20px;
        }

        iframe {
            width: 100%;
            height: 450px;
            border: 0;
        }
    </style>
</head>

<body>

    <h1>Restaurant Location Finder</h1>

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="address"
            placeholder="Enter restaurant address"
            value="{{ address }}"
            required
        >

        <button type="submit">
            Find Location
        </button>

    </form>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    {% if latitude and longitude %}

        <div class="location-info">

            <h3>Restaurant Location</h3>

            <p>
                <strong>Address:</strong>
                {{ address }}
            </p>

            <p>
                <strong>Latitude:</strong>
                {{ latitude }}
            </p>

            <p>
                <strong>Longitude:</strong>
                {{ longitude }}
            </p>

        </div>


        <iframe
            src="https://www.google.com/maps/embed/v1/view?key={{ google_maps_api_key }}&center={{ latitude }},{{ longitude }}&zoom=15"
            allowfullscreen
            loading="lazy">
        </iframe>

    {% endif %}

</body>
</html>
